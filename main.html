<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project-IOV3</title>

    <link rel="stylesheet" href="/styles/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Text:ital@0;1&display=swap"
        rel="stylesheet">
</head>

<body>
    <section id="name-field-block">
        <h1>Welcome</h1>
        <section class="content" id="name-field-block-content">
            <span id="name-error" class="no-select secondary-font">Incorrect name, try again!</span>
            <div id="name-check-field">
                <input type="search" name="name" class="input" placeholder="Enter your name" />
                <button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-arrow-right" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                    </svg>
                </button>
            </div>
        </section>
    </section>

    <div id="loader1" class="loader hidden"></div>

    <section id="dob-field-block" class="hidden">
        <h1>Verify</h1>
        <section id="pin-field-block-content" class="content">
            <span class="no-select secondary-font">Enter your Date of Birth</span>
            <span id="dob-pin-error" class="no-select secondary-font hidden">It's incorrect! Try again</span>
            <div id="pin-field">
                <input type="text" name="pin1" class="input pin" maxlength="1" inputmode="numeric" placeholder="-" />
                <input type="text" name="pin2" class="input pin" maxlength="1" inputmode="numeric" placeholder="-" />
                <input type="text" name="pin3" class="input pin" maxlength="1" inputmode="numeric" placeholder="-" />
                <input type="text" name="pin4" class="input pin" maxlength="1" inputmode="numeric" placeholder="-" />
                <input type="text" name="pin5" class="input pin" maxlength="1" inputmode="numeric" placeholder="-" />
                <input type="text" name="pin6" class="input pin" maxlength="1" inputmode="numeric" placeholder="-" />
                <input type="text" name="pin7" class="input pin" maxlength="1" inputmode="numeric" placeholder="-" />
            </div>
            <button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                </svg>
            </button>
        </section>
    </section>

    <div id="loader2" class="loader hidden"></div>

    <section id="success-block" class="hidden">
        <h1>Verify</h1>
    </section>
    <script src="scripts/transition.js"></script>

    <script src="scripts/name-field.js"></script>
    <script src="scripts/auto-pin-field.js"></script>
    <script src="scripts/pin-field-checker.js"></script>
</body>

</html>
